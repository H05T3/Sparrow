<!DOCTYPE html>

<body>
    <header>
        <h1>Sparrow</h1>

    <section class="firstThingYouSee">
        <span id="box">
            <h1>Sparrow: Bird Lookup</h1>
            <p>Sparrow is a bird look up site to find pictures, facts,

        <section>
            <div id="bird-lookup">

                <p>Data will be shown below</p>
            </div>
        </section>
        
        
        
    </main>
